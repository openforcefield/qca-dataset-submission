---
# deployment of GPU-enabled qcarchive prod environments for docker deployments
# Uses explicit CUDA 13.3.1 for compatibility with NRP and other HPC systems

name: Deployment - QCArchive Prod GPU Docker Environments

on:
  workflow_dispatch:

jobs:
  build-deploy-gpu-docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env-name:
          - qcarchive-worker-openff-psi4_cuest
    steps:
      - name: Checkout code
        uses: nschloe/action-cached-lfs-checkout@v1

      - name: ensure we only have one instance running
        uses: softprops/turnstyle@master
        env:
          GITHUB_TOKEN: ${{ secrets.GH_DANGERBOT_TOKEN_LIMITED }}
        with:
          abort-after-seconds: 60

      - name: Log in to the Container registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64

      - name: Build and push Docker images
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ matrix.env-name }}-gpu-latest
          file: ./devtools/docker/qcarchive-worker-openff/Dockerfile.gpu
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:${{ matrix.env-name }}-gpu-buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:${{ matrix.env-name }}-gpu-buildcache,mode=max
          build-args: |
            ENV_NAME=${{ matrix.env-name }}
            CUDA_VERSION=13.3.1
